<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="18">
  <title>Stepper motor IP core — block diagram</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- inputs -->
  <g fill="#555" font-size="15">
    <text x="30" y="120">EN</text>
    <text x="30" y="150">DIR</text>
    <text x="30" y="180">VEL[1:0]</text>
    <text x="30" y="210">STEPS[5:0]</text>
    <text x="30" y="240">START</text>
  </g>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M118 114H170"/><path d="M118 144H170"/><path d="M118 174H170"/><path d="M118 204H170"/><path d="M118 234H170" marker-end="url(#a)"/>
  </g>

  <!-- synchroniser -->
  <rect x="170" y="90" width="180" height="170" rx="2" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="260" y="160" text-anchor="middle" font-weight="700">sync</text>
  <text x="260" y="186" text-anchor="middle" fill="#555" font-size="13">two flip-flops per input</text>
  <text x="260" y="206" text-anchor="middle" fill="#555" font-size="13">START → 1-cycle pulse</text>

  <!-- FSM -->
  <rect x="410" y="60" width="200" height="110" rx="2" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="510" y="100" text-anchor="middle" font-weight="700">control FSM</text>
  <text x="510" y="126" text-anchor="middle" fill="#555" font-size="13">idle · accel · cruise · decel</text>
  <text x="510" y="146" text-anchor="middle" fill="#555" font-size="13">brake when left ≤ n_accel</text>

  <!-- ramp -->
  <rect x="670" y="60" width="200" height="110" rx="2" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="770" y="100" text-anchor="middle" font-weight="700">ramp</text>
  <text x="770" y="126" text-anchor="middle" fill="#555" font-size="13">incr ± ΔINCR every 1 ms</text>
  <text x="770" y="146" text-anchor="middle" fill="#555" font-size="13">same slope up and down</text>

  <!-- phase accumulator -->
  <rect x="410" y="230" width="200" height="110" rx="2" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="510" y="270" text-anchor="middle" font-weight="700">phase accumulator</text>
  <text x="510" y="296" text-anchor="middle" fill="#555" font-size="13">acc += incr; tick on carry</text>
  <text x="510" y="316" text-anchor="middle" fill="#555" font-size="13">rate = incr · f_clk / 2²⁶</text>

  <!-- sequencer -->
  <rect x="410" y="400" width="200" height="100" rx="2" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="510" y="440" text-anchor="middle" font-weight="700">sequencer</text>
  <text x="510" y="466" text-anchor="middle" fill="#555" font-size="13">8-entry half-step table</text>

  <!-- coils -->
  <rect x="670" y="400" width="200" height="100" rx="2" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="770" y="440" text-anchor="middle" font-weight="700">coils A · B · C · D</text>
  <text x="770" y="466" text-anchor="middle" fill="#555" font-size="13">ULN2003 → 28BYJ-48</text>

  <!-- wires -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M350 130H410"/>
    <path d="M610 115H670"/>
    <path d="M770 170V285H610"/>
    <path d="M510 340V400"/>
    <path d="M610 450H670"/>
    <path d="M350 220H380V285H410"/>
  </g>
  <g fill="#555" font-size="13">
    <text x="352" y="122">inputs</text>
    <text x="620" y="107">target</text>
    <text x="780" y="236">incr</text>
    <text x="520" y="376">tick (clock enable)</text>
    <text x="625" y="442">idx</text>
  </g>

  <!-- footer -->
  <line x1="30" y1="530" x2="930" y2="530" stroke="#ddd"/>
  <text x="30" y="552" fill="#555" font-size="14">One 50 MHz clock domain · no derived clocks · no multiplier or divider · VHDL on a Cyclone V (DE10-Standard)</text>
</svg>
