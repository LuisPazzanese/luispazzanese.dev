<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560">
  <title>Single-cycle MIPS CPU: datapath block diagram</title>
  <!-- Blocks are the VHDL entities in the course repo (mips_cpu.vhd and friends). -->
  <style>
    .ink { stroke: #16181a; fill: none; stroke-width: 1.5; }
    .box { fill: #fbfbf9; stroke: #16181a; stroke-width: 1.5; }
    .mem { fill: #fbfbf9; stroke: #16181a; stroke-width: 1.5; stroke-dasharray: 0; }
    .t { font: 600 15px ui-monospace, Menlo, Consolas, monospace; fill: #16181a; letter-spacing: .04em; }
    .d { font: 13px system-ui, sans-serif; fill: #5c6166; }
    .s { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #5c6166; }
    .ctl { stroke: #1f7a4d; fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .head { fill: #1f7a4d; }
    .ink-head { fill: #16181a; }
    .rule { stroke: #d9dcd6; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e5e8e6; }
      .box, .mem { fill: #0f1211; stroke: #e5e8e6; }
      .t { fill: #e5e8e6; }
      .d, .s { fill: #98a09c; }
      .ctl { stroke: #4cc38a; }
      .head { fill: #4cc38a; }
      .ink-head { fill: #e5e8e6; }
      .rule { stroke: #2b332f; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="ink-head"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="head"/>
    </marker>
  </defs>

  <!-- fetch -->
  <rect x="30" y="230" width="90" height="70" class="box"/>
  <text x="75" y="262" text-anchor="middle" class="t">PC</text>
  <text x="75" y="282" text-anchor="middle" class="d">next_pc</text>

  <rect x="160" y="210" width="130" height="110" class="mem"/>
  <text x="225" y="250" text-anchor="middle" class="t">ROM</text>
  <text x="225" y="274" text-anchor="middle" class="d">1024 × 32</text>
  <text x="225" y="294" text-anchor="middle" class="d">M10K, rising edge</text>

  <!-- decode -->
  <rect x="340" y="60" width="180" height="80" class="box"/>
  <text x="430" y="96" text-anchor="middle" class="t">DECODER</text>
  <text x="430" y="120" text-anchor="middle" class="d">48 instructions → ctrl_t</text>

  <rect x="340" y="210" width="180" height="110" class="box"/>
  <text x="430" y="250" text-anchor="middle" class="t">REG FILE</text>
  <text x="430" y="274" text-anchor="middle" class="d">32 × 32 bits</text>
  <text x="430" y="294" text-anchor="middle" class="d">2 read, 1 write</text>

  <rect x="340" y="380" width="180" height="70" class="box"/>
  <text x="430" y="412" text-anchor="middle" class="t">EXTEND</text>
  <text x="430" y="432" text-anchor="middle" class="d">sign / zero, imm16</text>

  <!-- execute -->
  <rect x="580" y="200" width="140" height="130" class="box"/>
  <text x="650" y="246" text-anchor="middle" class="t">ALU</text>
  <text x="650" y="270" text-anchor="middle" class="d">bit-slice add/sub</text>
  <text x="650" y="290" text-anchor="middle" class="d">logic · slt · shifts</text>

  <rect x="580" y="380" width="140" height="70" class="box"/>
  <text x="650" y="412" text-anchor="middle" class="t">MULT</text>
  <text x="650" y="432" text-anchor="middle" class="d">33×33 → HI / LO</text>

  <!-- memory -->
  <rect x="770" y="200" width="160" height="130" class="mem"/>
  <text x="850" y="246" text-anchor="middle" class="t">RAM + MMIO</text>
  <text x="850" y="270" text-anchor="middle" class="d">4 KB, 4 × 8-bit banks</text>
  <text x="850" y="290" text-anchor="middle" class="d">LEDs · HEX · SW · KEY</text>

  <!-- data wires -->
  <g class="ink" marker-end="url(#a)">
    <path d="M120 265H158"/>
    <path d="M290 250H338"/>
    <path d="M290 300H315V415H338"/>
    <path d="M520 245H578"/>
    <path d="M520 415H550V300H578"/>
    <path d="M520 290H540V415H578"/>
    <path d="M720 265H768"/>
  </g>
  <!-- write-back bus: RAM/ALU and MULT → register file (enters from below) -->
  <g class="ink" marker-end="url(#a)">
    <path d="M850 330V500H560V352H470V322"/>
  </g>
  <path d="M650 450V500" class="ink"/>
  <!-- PC update -->
  <path d="M225 210V170H75V228" class="ink" marker-end="url(#a)"/>

  <!-- control -->
  <g class="ctl" marker-end="url(#c)">
    <path d="M290 230H310V100H338"/>
    <path d="M520 100H650V198"/>
    <path d="M520 85H850V198"/>
  </g>

  <g class="s">
    <text x="296" y="270">instr</text>
    <text x="528" y="237">rs, rt</text>
    <text x="728" y="257">addr</text>
    <text x="660" y="78">ctrl: alu_op, mem_*, wb_src</text>
    <text x="85" y="162">branch / jump target</text>
    <text x="566" y="518">write-back: ALU · load · PC+4 · HI/LO</text>
  </g>

  <line x1="30" y1="530" x2="930" y2="530" class="rule"/>
  <text x="30" y="552" class="s">32-BIT SINGLE-CYCLE · 25 MHz · CYCLONE V (DE0-CV) · VERIFIED WITH COCOTB + GHDL</text>
</svg>
